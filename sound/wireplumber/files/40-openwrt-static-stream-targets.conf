# Keep streams on the target they request.
#
# With linking.follow-default-target (upstream default: true), a stream whose
# target.object is the current default sink or source is treated as following
# the default, and is moved when the default changes, as in PulseAudio.
# Disable this, so that such streams stay on the device they requested.
#
# Restoring saved stream targets, which would take priority over
# target.object, is disabled by the main-embedded profile the init script
# selects (its mixin.stateless disables hooks.stream.state).
wireplumber.settings = {
  linking.follow-default-target = false
}
