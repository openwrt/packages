# Enable WirePlumber's Bluetooth monitor. Installed only when pipewire is built
# with Bluetooth support (PIPEWIRE_BLUETOOTH).
# Loaded after 30-openwrt-monitors.conf, so this re-enables the bluez monitor
# disabled there. Needs bluez-daemon + D-Bus running at runtime.
wireplumber.profiles = {
  main-embedded = {
    monitor.bluez = required
  }
}
