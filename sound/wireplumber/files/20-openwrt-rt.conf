# Realtime scheduling on OpenWrt.
#
# module-rt first makes the data threads realtime directly and sets the main
# thread's nice level (nice.level, -11 in the stock configs of the PipeWire
# daemons). This needs RLIMIT_RTPRIO and RLIMIT_NICE, which the procd init
# scripts of pipewire, pipewire-pulse and wireplumber grant; other services
# that should run with realtime priority need the same limits.
#
# If either step fails and pipewire is built with D-Bus support, module-rt
# falls back to the realtime portal or RTKit, which OpenWrt does not provide,
# so realtime priority is lost either way. Disable both fallbacks to avoid
# D-Bus calls to services that do not exist.
module.rt.args = {
  rtkit.enabled = false
  rtportal.enabled = false
}
