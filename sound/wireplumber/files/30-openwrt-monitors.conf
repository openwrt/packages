# Hardware monitors of the main-embedded profile, which the init script
# selects. The ALSA monitor is required. The V4L2 and Bluetooth monitors are
# disabled here and enabled by 31-openwrt-v4l2.conf and 32-openwrt-bluez.conf,
# which are installed only when the respective support is built. pipewire is
# built without libcamera.
wireplumber.profiles = {
  main-embedded = {
    monitor.alsa = required
    monitor.bluez = disabled
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
  }
}
