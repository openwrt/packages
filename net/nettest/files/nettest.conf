# nettest server configuration, see
# https://github.com/specure/nettest/blob/master/nettest.conf
# for the full list of options.

# Measurement ports. Open TCP 5005 and UDP 5004 on the WAN only if this
# is a public measurement server; LAN clients reach them without a rule.
server_tcp_port = 5005
server_udp_port = 5004
# Each worker is an OS thread. The upstream default of 30 is meant for a
# server; four is enough for a router and leaves RAM for the rest of the
# system.
server_workers = 4

# Announce the server as nettest.local over mDNS
enable_mdns = true

# Serve the browser speed test on the measurement port
enable_web_ui = true

# QUIC/WebTransport endpoint for browser packet loss measurements.
# Browsers only allow this on HTTPS pages, so it is of no use over the
# plain HTTP web UI; disable it to save a UDP port.
enable_webtransport = false
server_wt_port = 5006
