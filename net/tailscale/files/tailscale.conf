config settings 'settings'
	option log_stderr '1'
	option log_stdout '1'
	option port '41641'
	option state_file '/etc/tailscale/tailscaled.state'
	# default to using nftables - change below to 'iptables' if still using iptables
	option fw_mode 'nftables'
	# Optional Go runtime controls; uncomment and adjust after measuring RAM and CPU.
	# The values below are examples, not defaults or recommendations for every device.
	# option gogc '50'
	# option gomemlimit '64MiB'
	# Lower gogc increases GC frequency. Gomemlimit is a soft limit on
	# Go-managed memory, not an RSS limit.
